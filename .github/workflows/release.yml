# 打 v* tag 时构建三端扩展包并发布 GitHub Release。
# 三端统一 GitHub 分发、不进商店：Chrome/Edge 下载 zip 加载已解压，Firefox 改名 .xpi
# 用 Developer Edition 安装或临时加载（README「安装使用」）。
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: tag 与 package.json 版本一致性
        run: |
          VER="v$(node -p "require('./package.json').version")"
          if [ "$VER" != "${{ github.ref_name }}" ]; then
            echo "::error::tag ${{ github.ref_name }} != package.json $VER"; exit 1
          fi

      - run: npm run build
      - run: npm run pack
      - run: node tools/test_pack.js

      - name: 发布 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/pack/*.zip
          body: |
            三端扩展包（统一 GitHub 分发，不进商店），安装步骤见 README「安装使用」。

            - **Chrome / Edge**: 下载 `translatawiki-chrome-*.zip` 解压 → chrome://extensions（Edge: edge://extensions）→ 开发者模式 → 加载已解压的目录
            - **Firefox**: 下载 `translatawiki-firefox-*.zip` → 后缀改 `.xpi` → Developer Edition/Nightly（xpinstall.signatures.required=false）从文件安装；或解压后 about:debugging 临时载入 manifest.json（重启失效）
