# 打 v* tag 时构建三端扩展包并发布 GitHub Release。
# Chrome 渠道不走商店：用户从 Release 下载 chrome zip 加载已解压（README「Chrome 安装」）。
# edge / firefox zip 同时产出，供 Edge Partner Center 与 AMO 提交（store/listing-*.md）。
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: tag 与 package.json 版本一致性
        run: |
          VER="v$(node -p "require('./package.json').version")"
          if [ "$VER" != "${{ github.ref_name }}" ]; then
            echo "::error::tag ${{ github.ref_name }} != package.json $VER"; exit 1
          fi

      - run: npm run build
      - run: npm run pack
      - run: node tools/test_pack.js

      - name: 发布 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/pack/*.zip
          body: |
            三端扩展包，见 README「安装使用」。

            - **Chrome**: 下载 `translatawiki-chrome-*.zip` 解压 → chrome://extensions 开发者模式 → 加载已解压的 `dist/chrome` 目录
            - **Edge**: 提交 Edge Add-ons 商店的包（当前请同 Chrome 方式在 edge://extensions 加载）
            - **Firefox**: 提交 AMO 的包 / Developer Edition 临时载入
